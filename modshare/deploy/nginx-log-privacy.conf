# Include in Nginx http context. Strip query strings from this site's access log
# because short-lived download credentials are bearer authorizations.
map $request_uri $ca_log_uri {
    ~^(?<ca_original_path>[^?]*) $ca_original_path;
    default $uri;
}
map $http_referer $ca_log_referer {
    ~^(?<ca_referrer_without_query>[^?]*) $ca_referrer_without_query;
    default "-";
}
log_format ca_private_access '$remote_addr - $remote_user [$time_local] '
    '"$request_method $ca_log_uri $server_protocol" $status $body_bytes_sent '
    '"$ca_log_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
