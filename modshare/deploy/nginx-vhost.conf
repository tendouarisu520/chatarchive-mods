# Future independent domain only; not installed/enabled by install.sh.
# Replace EVERY __MODSHARE_DOMAIN__ with the registered domain and provision its
# certificate BEFORE nginx -t. This is a placeholder, not an existing hostname.
server {
    listen 80;
    listen [::]:80;
    server_name __MODSHARE_DOMAIN__;
    location /.well-known/acme-challenge/ {
        root /opt/modshare/acme;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __MODSHARE_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__MODSHARE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MODSHARE_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /static/ {
        alias /opt/modshare/data/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    # External requests return404. Every X-Accel file dispatch first passes
    # Django authentication, resource state, and current account status checks.
    location ^~ /_modshare_private/ {
        internal;
        alias /opt/modshare/data/files/;
        autoindex off;
        types { }
        default_type application/octet-stream;
        sendfile on;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        if ($uri ~ "^/(api/(auth|me|manage)/|login/|register/|reset-password/)") {
            gzip off;
        }
        client_max_body_size 51m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
