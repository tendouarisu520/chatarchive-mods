# Independent SSH-only preview. Root reviews/enables this NEW config file.
# Never expose preview listen addresses publicly or add it to an old vhost.
server {
    listen 127.0.0.1:3311;
    server_name localhost 127.0.0.1;

    location ^~ /static/ {
        alias /opt/modshare/data/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    location ^~ /_modshare_private/ {
        internal;
        alias /opt/modshare/data/files/;
        autoindex off;
        types { }
        default_type application/octet-stream;
        sendfile on;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        client_max_body_size 51m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
