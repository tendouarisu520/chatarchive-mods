{% load static %}
<!doctype html>
<html lang="zh-CN" data-base="{{ app_base }}" data-page="{{ page }}" data-id="{{ object_id|default:'' }}" data-turnstile-sitekey="{{ turnstile_sitekey }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#168ddd">
  <meta name="description" content="ChatArchive 模组分享站，发现与分享素材和预设。独立公益资源社区，投稿审核后发布。">
  <title>ChatArchive 模组分享站 · 素材与预设分享</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'modshare/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'modshare/app.css' %}?v=20261006-mobile-1">
  <script src="{% static 'modshare/human-verification.js' %}?v=20261006-mobile-1" defer></script>
  <script src="{% static 'modshare/app.js' %}?v=20261018-access-1" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">跳至主要内容</a>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" data-link="/" aria-label="ChatArchive 模组分享站 首页">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="19" r="15" stroke="currentColor" stroke-width="1.4" stroke-dasharray="58 36" transform="rotate(-35 20 19)" opacity=".45"/><path d="M10 14h8l3 3h9v14H10z" fill="#e4f6ff" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 21h10M15 25h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m28 6 1.5 3L33 10l-3.5 1-1.5 3-1.5-3-3.5-1 3.5-1Z" fill="#ffdf7e"/></svg>
        <span>ChatArchive<small>模组分享站 · MOD COMMUNITY</small></span>
      </a>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="展开导航"><span></span><span></span><span></span></button>
      <nav class="main-nav" id="main-nav" aria-label="主要导航">
        <a data-link="/" data-nav="home">发现</a>
        <a data-link="/characters/" data-nav="characters">素材区</a>
        <a data-link="/presets/" data-nav="presets">预设区</a>
        <a data-link="/rankings/" data-nav="rankings">榜单</a>
        <span class="nav-divider" aria-hidden="true"></span>
        <a data-link="/upload/" data-nav="upload">上传资源</a>
        <a data-link="/my-uploads/" data-nav="mine">我的投稿</a>
        <span id="account-nav" class="account-nav"><a data-link="/login/" class="button small">登录 / 注册</a></span>
      </nav>
    </div>
  </header>
  <div class="global-banner wrap" id="global-banner" role="status" hidden></div>
  <main id="content" class="wrap main" tabindex="-1" aria-busy="true">
    <div class="loading-state"><span class="loading-orbit" aria-hidden="true"></span><p>正在加载资源…</p></div>
  </main>
  <footer class="site-footer wrap"><div class="footer-wordmark">ChatArchive <span>模组分享站</span></div><p>让每一份灵感，都有回响。<br><span>公益分享 · 素材与预设 · 投稿审核后发布</span></p><a data-link="/upload/">分享你的创作 <span aria-hidden="true">↗</span></a></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="action-dialog" class="action-dialog" aria-labelledby="dialog-title">
    <form id="dialog-form">
      <div class="dialog-heading"><span class="eyebrow">COMMUNITY CARE</span><button class="icon-button" id="dialog-close" type="button" aria-label="关闭弹窗">×</button></div>
      <h2 id="dialog-title"></h2><p id="dialog-copy" class="muted"></p>
      <label for="action-reason">操作原因 <span id="reason-required" class="muted">（必填）</span></label>
      <textarea id="action-reason" name="reason" rows="4" maxlength="500" placeholder="请说明原因，相关用户可以看到审核或封禁反馈。"></textarea>
      <div class="form-error" id="dialog-error" role="alert" hidden></div>
      <div class="dialog-actions"><button class="button" id="dialog-cancel" type="button">取消</button><button class="button primary" id="dialog-submit" type="submit">确认操作</button></div>
    </form>
  </dialog>
  <noscript><p class="noscript">此站需要 JavaScript 完成资源浏览、账号登录和投稿。请启用 JavaScript 后刷新页面。</p></noscript>
</body>
</html>
